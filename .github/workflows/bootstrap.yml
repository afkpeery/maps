name: Materialize MAPS v0.2 source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Release MAPS v0.2 payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install brotli
      - name: Restore source archive from tracked payload parts
        run: |
          python - <<'PY'
          import base64
          import brotli
          import io
          from pathlib import Path
          import tarfile
          parts = sorted(Path('.bootstrap').glob('payload.part*'))
          if len(parts) != 5:
              raise RuntimeError(f'Expected exactly 5 payload parts; got {len(parts)}')
          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
          blob = base64.b64decode(encoded, validate=True)
          with tarfile.open(fileobj=io.BytesIO(brotli.decompress(blob))) as archive:
              for member in archive.getmembers():
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                      raise ValueError(f'Unsafe archive member: {member.name}')
              archive.extractall('.', filter='data')
          PY
      - name: Commit reconstructed source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .bootstrap
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Materialize MAPS v0.2 accuracy and calibration release"
            git push origin HEAD:main
          fi
